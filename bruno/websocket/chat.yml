info:
  name: chat
  type: websocket
  seq: 1

websocket:
  url: "{{NAGARE_WEBSOCKET}}"
  message:
    - title: register chat
      selected: true
      message:
        type: json
        data: |-
          {
            "event":"RegisterChatListenerEvent",
            "data":{
              "id":"1",
              "sessionID":"a9ac17a9-2a20-4b0b-8799-46f44b5b306d"
            }
          }
    - title: auth
      selected: false
      message:
        type: json
        data: |-
          {
            "event":"AuthEvent",
            "data":{
              "token":"{{AUTH_TOKEN}}"
            }
          }
  auth: inherit

settings:
  timeout: 0
  keepAliveInterval: 0
